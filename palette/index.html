<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PromptCAD</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="chat-switch" id="chatSwitch" aria-haspopup="menu" aria-expanded="false" title="Chats in this design">
        <span class="chat-title" id="chatTitle">New chat</span>
        <svg class="i i-sm" aria-hidden="true"><use href="#i-chevron"/></svg>
      </button>
      <div class="topbar-actions">
        <button class="model-chip" id="modelChip" aria-haspopup="menu" aria-expanded="false" title="Choose a model">
          <span class="dot" id="modelDot" aria-hidden="true"></span>
          <span class="model-name" id="modelName">Choose a model</span>
          <svg class="i i-sm" aria-hidden="true"><use href="#i-chevron"/></svg>
        </button>
        <button class="icon-btn" id="newChat" title="New chat (Ctrl+Shift+O)" aria-label="New chat">
          <svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>
        </button>
        <button class="icon-btn" id="openSettings" title="Settings (Ctrl+,)" aria-label="Settings">
          <svg class="i" aria-hidden="true"><use href="#i-gear"/></svg>
        </button>
      </div>
    </header>

    <main class="thread" id="thread" aria-live="polite" aria-busy="false">
      <div class="thread-inner" id="threadInner"></div>
    </main>

    <section class="params" id="params" hidden>
      <button class="params-head" id="paramsHead" aria-expanded="false" aria-controls="paramsBody">
        <svg class="i i-sm chev" aria-hidden="true"><use href="#i-chevron"/></svg>
        <span>Parameters</span>
        <span class="params-meta" id="paramsMeta"></span>
      </button>
      <div class="params-body" id="paramsBody" role="list"></div>
    </section>

    <footer class="composer">
      <div class="composer-box" id="composerBox">
        <textarea id="input" rows="1" placeholder="Describe a part…" aria-label="Message PromptCAD"></textarea>
        <div class="composer-row">
          <button class="build-chip" id="buildChip" aria-haspopup="menu" aria-expanded="false" type="button"></button>
          <span class="hint" id="hint"><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span>
          <button class="send-btn" id="send" aria-label="Send" title="Send">
            <svg class="i" aria-hidden="true"><use href="#i-arrow-up"/></svg>
          </button>
        </div>
      </div>
    </footer>

    <!-- Popovers -->
    <div class="popover" id="chatMenu" role="menu" hidden></div>
    <div class="popover picker" id="modelMenu" role="menu" aria-label="Choose a model" hidden></div>
    <div class="popover build-menu" id="buildMenu" role="menu" aria-label="Build into" hidden></div>

    <!-- Settings page -->
    <section class="settings-view" id="settingsView" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
      <header class="settings-head">
        <button class="icon-btn" id="settingsBack" aria-label="Close settings"></button>
        <h1 id="settingsTitle">Settings</h1>
      </header>
      <div class="settings-body" id="settingsBody"></div>
    </section>

    <!-- JSON sheet -->
    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <header class="sheet-head">
        <h2 id="sheetTitle">Design JSON</h2>
        <button class="icon-btn" id="sheetClose" aria-label="Close">
          <svg class="i" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </header>
      <div class="editor-wrap">
        <pre class="gutter" id="gutter" aria-hidden="true"></pre>
        <textarea id="jsonEditor" spellcheck="false" wrap="off" aria-label="Design JSON"></textarea>
      </div>
      <footer class="sheet-foot">
        <span class="json-status" id="jsonStatus" role="status"></span>
        <div class="sheet-actions">
          <button class="btn ghost" id="jsonFormat">Format</button>
          <button class="btn ghost" id="jsonCopy">Copy</button>
          <button class="btn primary" id="jsonApply">Build</button>
        </div>
      </footer>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></symbol>
      <symbol id="i-restore" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/></symbol>
      <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol>
      <symbol id="i-cube" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
      <symbol id="i-component" viewBox="0 0 24 24"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    </defs>
  </svg>

  <script src="app.js"></script>
</body>
</html>
